<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>GReGOrI Legacy Interactive Console · v0.4.2</title>
  <style>
    :root {
      --bg: #000000;
      --panel: #0a0a0a;
      --border: #1d3356;
      --cyan: #25d9f4;
      --pink: #ef42d8;
      --gold: #ffc44e;
      --green: #48dc98;
      --red: #e05260;
      --term-text: #e6f1ff;
      --term-dim: #7991b5;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      height: 100%;
      background: var(--bg);
      color: var(--term-text);
      font-family: Consolas, 'Courier New', Monaco, monospace;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }
    /* Header Bar */
    header {
      height: 48px;
      background: #080e1f;
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 16px;
      flex-shrink: 0;
      user-select: none;
    }
    .header-left {
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .window-dots {
      display: flex;
      gap: 6px;
    }
    .dot {
      width: 11px;
      height: 11px;
      border-radius: 50%;
      display: inline-block;
    }
    .dot.red { background: #ff5f56; }
    .dot.yellow { background: #ffbd2e; }
    .dot.green { background: #27c93f; }
    .console-title {
      font-size: 13px;
      font-weight: 700;
      color: var(--cyan);
      letter-spacing: 0.5px;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .console-title span {
      color: #ffffff;
      opacity: 0.7;
      font-weight: 400;
    }
    .header-right {
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .btn {
      background: #111d38;
      color: var(--term-text);
      border: 1px solid #28446e;
      border-radius: 6px;
      padding: 5px 10px;
      font-size: 11.5px;
      font-family: inherit;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 5px;
      transition: all .15s ease;
      text-decoration: none;
    }
    .btn:hover {
      background: #18294e;
      border-color: var(--cyan);
      color: #ffffff;
    }
    .btn.danger:hover {
      border-color: var(--red);
      color: var(--red);
    }
    .status-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-size: 11px;
      font-weight: 700;
      color: var(--green);
      background: rgba(72, 220, 152, 0.1);
      border: 1px solid rgba(72, 220, 152, 0.3);
      border-radius: 99px;
      padding: 3px 9px;
      letter-spacing: 0.5px;
      margin-right: 6px;
    }
    .status-badge.offline {
      color: var(--red);
      background: rgba(224, 82, 96, 0.1);
      border-color: rgba(224, 82, 96, 0.3);
    }
    .status-dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: currentColor;
      box-shadow: 0 0 6px currentColor;
    }

    /* Terminal Container */
    #terminal-container {
      flex: 1;
      display: flex;
      flex-direction: column;
      padding: 16px 20px 10px;
      overflow: hidden;
      background: #000000;
    }

    #output {
      flex: 1;
      overflow-y: auto;
      white-space: pre-wrap;
      word-break: break-word;
      line-height: 1.45;
      font-size: 13.5px;
      color: var(--term-text);
      padding-right: 6px;
      scrollbar-width: thin;
      scrollbar-color: #2b4369 #050713;
    }
    #output::-webkit-scrollbar { width: 8px; }
    #output::-webkit-scrollbar-track { background: #050713; }
    #output::-webkit-scrollbar-thumb { background: #2b4369; border-radius: 4px; }

    /* Interactive Input Bar */
    #input-line {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-top: 10px;
      padding-top: 10px;
      border-top: 1px solid var(--border);
      background: transparent;
      flex-shrink: 0;
    }
    .prompt {
      color: var(--cyan);
      font-weight: 700;
      font-size: 15px;
      user-select: none;
    }
    #cmd-input {
      flex: 1;
      background: transparent;
      border: none;
      outline: none;
      color: #ffffff;
      font-family: inherit;
      font-size: 14px;
      caret-color: var(--cyan);
    }
    #cmd-input::placeholder {
      color: var(--term-dim);
      opacity: 0.5;
    }
    .send-btn {
      background: #0d2847;
      border: 1px solid var(--cyan);
      color: var(--cyan);
      border-radius: 5px;
      padding: 4px 12px;
      font-size: 12px;
      font-family: inherit;
      cursor: pointer;
      transition: all .15s ease;
    }
    .send-btn:hover {
      background: var(--cyan);
      color: #050713;
      box-shadow: 0 0 10px rgba(37, 217, 244, 0.4);
    }

    /* ANSI Colors in Terminal */
    .ansi-cyan { color: #25d9f4; font-weight: bold; }
    .ansi-magenta { color: #ef42d8; font-weight: bold; }
    .ansi-yellow { color: #ffc44e; }
    .ansi-green { color: #48dc98; }
    .ansi-red { color: #e05260; }
    .ansi-bold { font-weight: bold; color: #ffffff; }
    .ansi-dim { color: #7991b5; }
  </style>
</head>
<body>

  <header>
    <div class="header-left">
      <div class="window-dots">
        <span class="dot red"></span>
        <span class="dot yellow"></span>
        <span class="dot green"></span>
      </div>
      <div class="console-title">
        GReGOrI <span>Legacy Python Interactive Console</span> · v0.4.2
      </div>
    </div>
    <div class="header-right">
      <div id="statusBadge" class="status-badge">
        <span class="status-dot"></span>
        <span id="statusText">ONLINE</span>
      </div>
      <button class="btn" onclick="clearOutput()" title="Clear screen (Ctrl+L)">Clear</button>
      <button class="btn" onclick="restartSession()" title="Restart fresh Python session">Restart</button>
      <button class="btn danger" onclick="interruptSession()" title="Send interrupt (Ctrl+C)">Interrupt</button>
      <a href="/" class="btn" title="Return to modern GReGOrI web app">← Modern GUI</a>
    </div>
  </header>

  <main id="terminal-container" onclick="focusInput()">
    <div id="output"></div>
    <form id="input-line" onsubmit="handleSend(event)">
      <span class="prompt">❯</span>
      <input id="cmd-input" type="text" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false" placeholder="Type choice or parameter and press Enter...">
      <button type="submit" class="send-btn">Send</button>
    </form>
  </main>

  <script>
    let sessionId = null;
    let pollOffset = 0;
    let isPolling = false;
    let pollTimer = null;
    let history = [];
    let historyIdx = -1;

    const outputEl = document.getElementById('output');
    const inputEl = document.getElementById('cmd-input');
    const statusBadge = document.getElementById('statusBadge');
    const statusText = document.getElementById('statusText');

    function focusInput() {
      inputEl.focus();
    }

    function ansiToHtml(text) {
      const colorMap = {
        '30': 'color:#64748b;', '31': 'color:#f43f5e;', '32': 'color:#10b981;', '33': 'color:#f59e0b;',
        '34': 'color:#38bdf8;', '35': 'color:#d946ef;', '36': 'color:#22d3ee;', '37': 'color:#f8fafc;',
        '90': 'color:#94a3b8;', '91': 'color:#fb7185;', '92': 'color:#48dc98;', '93': 'color:#fde047;',
        '94': 'color:#67e8f9;', '95': 'color:#f472b6;', '96': 'color:#25d9f4;', '97': 'color:#ffffff;',
        '1': 'font-weight:bold;color:#ffffff;', '2': 'opacity:0.7;'
      };
      let escaped = text.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
      return escaped.replace(/\x1b\[([0-9;]*)m/g, (match, codes) => {
        if (!codes || codes === '0') return '</span>';
        let parts = codes.split(';');
        let style = parts.map(c => colorMap[c] || '').join(' ');
        return `<span style="${style}">`;
      });
    }

    function appendOutput(text) {
      if (!text) return;
      outputEl.innerHTML += ansiToHtml(text);
      outputEl.scrollTop = outputEl.scrollHeight;
    }

    function clearOutput() {
      outputEl.innerHTML = '';
      focusInput();
    }

    async function startSession() {
      try {
        statusBadge.className = 'status-badge';
        statusText.textContent = 'CONNECTING...';
        appendOutput('Initializing GReGOrI Legacy Python session...\n\n');

        let res = await fetch('/api/legacy-console/start', { method: 'POST' });
        let data = await res.json();
        if (data.session_id) {
          sessionId = data.session_id;
          pollOffset = 0;
          statusBadge.className = 'status-badge';
          statusText.textContent = 'ONLINE';
          startPolling();
        } else {
          statusBadge.className = 'status-badge offline';
          statusText.textContent = 'ERROR';
          appendOutput('Error starting session: ' + (data.error || 'Unknown error') + '\n');
        }
      } catch (err) {
        statusBadge.className = 'status-badge offline';
        statusText.textContent = 'OFFLINE';
        appendOutput('Network error connecting to backend: ' + err.message + '\n');
      }
      focusInput();
    }

    function startPolling() {
      if (isPolling) return;
      isPolling = true;
      pollLoop();
    }

    async function pollLoop() {
      if (!isPolling || !sessionId) return;
      try {
        let res = await fetch(`/api/legacy-console/poll?session_id=${sessionId}&offset=${pollOffset}`);
        if (res.ok) {
          let data = await res.json();
          if (data.output) {
            appendOutput(data.output);
          }
          pollOffset = data.next_offset;
          if (!data.alive) {
            statusBadge.className = 'status-badge offline';
            statusText.textContent = 'TERMINATED';
          }
        }
      } catch (e) {
        // network blip, retry
      }
      if (isPolling) {
        pollTimer = setTimeout(pollLoop, 150);
      }
    }

    async function handleSend(e) {
      if (e) e.preventDefault();
      let text = inputEl.value;
      inputEl.value = '';

      if (text.trim()) {
        history.push(text);
        historyIdx = history.length;
      }

      // Echo command visually
      appendOutput(text + '\n');

      if (!sessionId) {
        appendOutput('[No active session. Restarting...]\n');
        await startSession();
        return;
      }

      try {
        await fetch('/api/legacy-console/input', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ session_id: sessionId, input: text })
        });
      } catch (err) {
        appendOutput('[Error sending input: ' + err.message + ']\n');
      }
      focusInput();
    }

    async function interruptSession() {
      if (!sessionId) return;
      appendOutput('^C\n');
      try {
        await fetch('/api/legacy-console/interrupt', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ session_id: sessionId })
        });
      } catch (e) {}
      focusInput();
    }

    async function restartSession() {
      isPolling = false;
      if (pollTimer) clearTimeout(pollTimer);
      outputEl.textContent = '';
      await startSession();
    }

    // Keyboard navigation (Up/Down history, Ctrl+C, Ctrl+L)
    document.addEventListener('keydown', e => {
      if (e.ctrlKey && e.key === 'c') {
        e.preventDefault();
        interruptSession();
      } else if (e.ctrlKey && e.key === 'l') {
        e.preventDefault();
        clearOutput();
      } else if (e.target === inputEl) {
        if (e.key === 'ArrowUp') {
          e.preventDefault();
          if (historyIdx > 0) {
            historyIdx--;
            inputEl.value = history[historyIdx] || '';
          }
        } else if (e.key === 'ArrowDown') {
          e.preventDefault();
          if (historyIdx < history.length - 1) {
            historyIdx++;
            inputEl.value = history[historyIdx] || '';
          } else {
            historyIdx = history.length;
            inputEl.value = '';
          }
        }
      }
    });

    // ── Sandbox cleanup on tab close / navigate away ──────────────────────────
    // sendBeacon is fire-and-forget and works reliably during unload.
    function _sendInterrupt() {
      if (!sessionId) return;
      const url = '/api/legacy-console/interrupt';
      const data = JSON.stringify({ session_id: sessionId });
      if (navigator.sendBeacon) {
        navigator.sendBeacon(url, new Blob([data], { type: 'application/json' }));
      } else {
        // Synchronous fallback for browsers without sendBeacon
        try {
          const xhr = new XMLHttpRequest();
          xhr.open('POST', url, false);  // synchronous
          xhr.setRequestHeader('Content-Type', 'application/json');
          xhr.send(data);
        } catch (e) {}
      }
      sessionId = null;
    }

    window.addEventListener('beforeunload', _sendInterrupt);

    // Also catch hidden tab → visible-again scenario: if tab is hidden and then
    // the process has already ended, clear the session gracefully.
    document.addEventListener('visibilitychange', () => {
      if (document.hidden && sessionId) {
        _sendInterrupt();
      }
    });

    window.onload = () => {
      startSession();
    };
  </script>
</body>
</html>
